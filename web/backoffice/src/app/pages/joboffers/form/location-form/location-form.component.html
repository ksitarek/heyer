<ng-container [formGroup]="form()">
  <fieldset formGroupName="location">
    <div class="grid grid-cols-2 gap-4">
      <label hlmLabel class="w-full">
        City
        <input type="text" class="w-full" hlmInput formControlName="city" />
      </label>

      <label hlmLabel class="w-full">
        Country
        <input type="text" class="w-full" hlmInput formControlName="country" />
      </label>
    </div>
  </fieldset>
</ng-container>

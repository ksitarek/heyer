<h-page-header>New job offer</h-page-header>

<form class="flex flex-col items-end max-w-2xl mt-10 space-y-6" [formGroup]="jobOfferForm">
  <h-description-form class="w-full" [form]="jobOfferForm" />

  <div class="flex flex-row">
    <button type="submit" hlmBtn class="w-24" [disabled]="submitButtonDisabled" (click)="saveDraft()">
      Next <ng-icon name="lucideArrowRight" class="ml-2" />
    </button>
  </div>
</form>

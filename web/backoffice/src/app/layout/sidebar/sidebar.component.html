<div [class]="sidebarClasses">
  <h-sidebar-menu [expanded]="expanded()" />

  @if (expanded()) {
    <button type="button" hlmBtn variant="ghost" class="w-full" (click)="toggle()">
      <ng-icon name="lucidePanelLeftClose" />&nbsp;Collapse
    </button>
  }

  @if (!expanded()) {
    <button type="button" hlmBtn variant="ghost" class="w-full" (click)="toggle()">
      <ng-icon name="lucidePanelLeftOpen" />
    </button>
  }
</div>

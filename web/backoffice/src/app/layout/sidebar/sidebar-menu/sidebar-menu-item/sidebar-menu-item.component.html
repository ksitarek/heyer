@if (expanded()) {
  <a
    class="flex items-center px-4 py-2 text-sm text-gray-900 rounded-lg dark:text-white hover:bg-primary-foreground dark:hover:bg-gray-700 group"
    [routerLink]="dto().path"
  >
    <ng-icon [name]="dto().icon" />
    <span class="ms-3">{{ dto().label }}</span>
  </a>
} @else {
  <a hlmBtn variant="ghost" class="w-full" [routerLink]="dto().path" [hlmTooltipTrigger]="dto().label">
    <ng-icon [name]="dto().icon" />
  </a>
}

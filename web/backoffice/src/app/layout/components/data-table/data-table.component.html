<table class="w-full">
  <thead>
    <tr>
      <th
        *ngFor="let column of columns"
        class="font-semibold text-left text-stone-900"
      >
        {{ column.label }}
      </th>
    </tr>
  </thead>

  <tbody>
    <ng-container *ngFor="let row of data$ | async">
      <ng-content
        *ngTemplateOutlet="
          rowTemplate;
          context: {
            $implicit: row
          }
        "
      ></ng-content
    ></ng-container>
  </tbody>
</table>

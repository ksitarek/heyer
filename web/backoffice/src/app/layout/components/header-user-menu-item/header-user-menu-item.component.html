<button
  class="flex items-center w-full gap-2 px-3 py-2 rounded-md cursor-pointer select-none text-start hover:bg-stone-100"
  (click)="itemClicked()"
>
  <ng-icon [name]="icon" />

  <p
    class="block font-sans text-sm antialiased font-normal leading-normal text-inherit"
  >
    {{ label }}
  </p>
</button>
